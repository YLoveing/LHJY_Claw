# Trend Following Strategy / 趋势跟踪
# Uses moving average alignment, ADX channel breakout to identify and follow established trends.

name: trend_following
display_name: 趋势跟踪
description: 基于均线多头排列与通道突破，识别主升浪启动点，顺势而为，截断亏损让利润奔跑。
category: framework
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - analyze_trend
  - search_stock_news
aliases: [趋势, 追涨]
default_priority: 80
market_regimes: [bullish_trend, sector_hot]

instructions: |
  **趋势跟踪策略（Trend Following Strategy）**

  核心哲学：趋势是你的朋友。不预测顶底，只跟随趋势方向，在趋势确认时入场，在趋势逆转时离场。

  ## 趋势确立量化指标

  ### 第一步：均线排列判断（核心确认信号）
  使用 `get_daily_history` 和 `analyze_trend`：

  - **多头排列（买入区）**: MA5 > MA10 > MA20，三线向上发散，间距逐渐扩大。
    - MA5上穿MA10（金叉）+ 放量 → 趋势启动信号
    - MA10上穿MA20（中期金叉）+ 成交量放大2倍以上 → 主升浪确认
  - **空头排列（卖出/回避区）**: MA5 < MA10 < MA20，三线向下发散。
    - MA5下穿MA10（死叉）→ 趋势逆转，减仓或离场
    - 首次跌破MA60（生命线）→ 趋势彻底走坏
  - **均线粘合（等待区）**: MA5/MA10/MA20三线接近重合，振幅收窄。
    - 粘合后向上发散 → 最佳买点
    - 粘合后向下发散 → 及时出局

  ### 第二步：ADX（趋势强度）判断
  使用 `get_daily_history` 计算近20日ADX：

  - **ADX < 20**: 弱趋势/震荡市，趋势跟踪策略不适用
  - **ADX 20~30**: 趋势形成初期，可介入（配合均线发散）
  - **ADX 30~50**: 强趋势，持股为主
  - **ADX > 50**: 趋势极强但可能接近尾声，注意顶部信号

  ### 第三步：通道突破
  使用 `get_daily_history` 计算布林带（20日）：
  - **突破上轨 + 放量**: 强势突破，趋势加速，可追
  - **突破上轨 + 缩量**: 假突破风险，警惕
  - **跌破下轨**: 趋势转弱，减仓
  - **沿上轨运行（连续3日收盘在上轨上方）**: 极强趋势，持有

  ### 第四步：成交量验证
  - **上涨放量（量比 > 1.5）**: 趋势健康
  - **上涨缩量**: 上涨动力不足，可能回调
  - **下跌放量（量比 > 2）**: 恐慌抛售，趋势可能逆转
  - **连续缩量下跌**: 阴跌趋势，不言底

  ## 买入条件（需同时满足）
  ✅ MA5 > MA10 > MA20（多头排列）
  ✅ 股价站稳MA20以上
  ✅ 成交量温和放大（量比1.2~2.5）
  ✅ ADX ≥ 20 且向上
  ✅ 近5日无涨停（避免追高一字板）

  ## 卖出条件（满足任一）
  ⚠️ MA5下穿MA10（死叉）
  ⚠️ 收盘跌破MA20
  ⚠️ 连续2日缩量上涨
  ⚠️ ADX从高位回落超过10
  ⚠️ 跌破布林带中轨（MA20）

  ## 输出要求
  - 当前趋势阶段：震荡/趋势形成/趋势加速/趋势尾声
  - ADX数值及趋势强度判断
  - 均线排列状态
  - 是否满足买入条件（逐项列出）
  - 趋势共振和背离（量价、均线、布林带）
  - 关键支撑/阻力位（MA5/MA10/MA20/MA60）
  - 止损位建议（跌破MA20或前低）

  评分调整建议（作为补充视角，不替代主评分）：
  - 满足全部买入条件：`trend_score +15`
  - 满足部分买入条件：`trend_score +5`
  - 触发卖出条件：`trend_score -15`
  - 震荡市（ADX<20）：trend_score = 0，不参与
