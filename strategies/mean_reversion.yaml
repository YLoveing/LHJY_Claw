# Mean Reversion Strategy / 均值回归
# Identifies oversold/overbought extremes using RSI, Bollinger Bands, and deviation from moving averages.

name: mean_reversion
display_name: 均值回归
description: 基于RSI超买超卖、乖离率和布林带，在价格偏离均值到极端时反向操作。
category: framework
core_rules: [1, 3, 6]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - analyze_trend
  - search_stock_news
aliases: [回归, 低吸, 反转]
default_priority: 70
market_regimes: [range_bound, downtrend_reversal]

instructions: |
  **均值回归策略（Mean Reversion Strategy）**

  核心哲学：价格终将回归均值。在极端偏离时逆势买入，在过度上涨时获利了结。

  ## 均值回归量化指标

  ### 第一步：RSI（相对强弱指标）- 核心信号
  使用 `get_daily_history` 计算近14日RSI：

  - **RSI < 20**: 极度过卖，强烈买入信号（但需确认非趋势性下跌）
  - **RSI 20~30**: 超卖区，关注买入机会
  - **RSI 30~45**: 偏弱，等待企稳
  - **RSI 45~55**: 中性区域，无信号
  - **RSI 55~70**: 偏强，持有但不追高
  - **RSI 70~80**: 超买区，关注卖出机会
  - **RSI > 80**: 极度过买，强烈卖出信号

  ### 第二步：乖离率（偏离均线幅度）
  使用 `get_daily_history` 计算价格偏离MA的幅度：

  - **乖离率（MA5）**:
    - 低于-5%：短线超卖，可能有反弹
    - 高于+8%：短线超买，可能有回调
  - **乖离率（MA20）**:
    - 低于-10%：中线超卖，反弹概率大
    - 高于+15%：中线超买，回调风险高
  - **乖离率（MA60）**:
    - 低于-20%：长期超卖，系统性超卖区域
    - 高于+30%：长期超买，泡沫区域

  ### 第三步：布林带位置
  使用 `get_daily_history` 计算布林带（20日, 2倍标准差）：

  - **触及/跌破下轨**: 
    - 缩量触下轨 → 反弹信号强
    - 放量跌穿下轨 → 可能趋势性下跌，不接飞刀
  - **触及/突破上轨**:
    - 缩量触上轨 → 可能回调
    - 放量突破上轨 → 强趋势，放弃均值回归，切换趋势策略

  ### 第四步：成交量配合
  - **下跌末端**: 恐慌放量后快速缩量 → 杀跌动能衰竭
  - **地量地价**: 成交量萎缩至60日均量的30%以下 + 价格企稳 → 底部区域
  - **反弹初期**: 从低位放量上涨（量比>1.5）+ 价格确认 → 反弹启动

  ## 逆势买入条件（需同时满足）
  ✅ RSI ≤ 30（超卖）
  ✅ 乖离率（MA20）≤ -8%
  ✅ 价格在布林带下轨附近或以下
  ✅ 成交量萎缩或由放量转为缩量企稳
  ✅ 无明显利空（新闻以中性或已消化的利空为主）

  ## 离场条件（满足任一）
  ⚠️ RSI回到55以上（反弹到位）
  ⚠️ 乖离率（MA20）回到 -2% 以内（回归均值）
  ⚠️ 价格回到布林带中轨并站稳
  ⚠️ 放量跌破前低（回归失败，止损）
  ⚠️ 持仓达到7个交易日未反弹（时间止损）

  ## 输出要求
  - 当前RSI数值及区间判断
  - 乖离率（MA5/MA20/MA60）及幅度
  - 布林带位置
  - 是否满足逆势买入条件（逐项列出）
  - 回归类型：正常回归 / 趋势性下跌（不接飞刀）
  - 预计反弹目标位（布林带中轨、MA20、MA60）
  - 止损位（前低或再跌5%）

  评分调整建议（作为补充视角，不替代主评分）：
  - 满足全部买入条件：`reversion_score +18`
  - 满足部分买入条件：`reversion_score +8`
  - 超买区（RSI>70+乖离率>5%）：`reversion_score -15`
  - 极度过热（RSI>80+乖离率>10%）：`reversion_score -20`
