name: daily-stock-analysis

services:
  analyzer:
    image: zhulinsen/daily_stock_analysis:latest
    container_name: stock-analyzer
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./.env:/app/.env
      # 覆盖容器内代码（本地开发模式），确保 refresh_stock_list 等修改生效
      - ./src/config.py:/app/src/config.py
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
